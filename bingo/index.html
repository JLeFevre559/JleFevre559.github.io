const bingoItems = [

]

generateBingo = () => {
    let seed = document.getElementById("bingo-items").value;
    let items = [...bingoItems];
    if (seed) {
        random = createSeededRNG("my-unique-string-seed");
        for (let i = 0; i < 25; i++) {
            let randomIndex = getRandomInt(0, items.length);
            document.getElementById(`bingo-item-${i}`).innerText = items[randomIndex];
            document.getElementById(`bingo-item-${i}`).classList.add("data-item");
            items.splice(randomIndex, 1);
        }
    }

}

toggleBingoItem = (item) => {
    item.classList.toggle("selected");
}

function xmur3(str) {
  let h = 1779033703 ^ str.length;
  for (let i = 0; i < str.length; i++) {
    h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
    h = h << 13 | h >>> 19;
  }
  return function() {
    h = Math.imul(h ^ (h >>> 16), 2246822507);
    h = Math.imul(h ^ (h >>> 13), 3266489909);
    return (h ^= h >>> 16) >>> 0;
  };
}

// Step 2: The Mulberry32 PRNG function
function mulberry32(a) {
  return function() {
    let t = a += 0x6D2B79F5;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
}

// Step 3: Combine them to accept a string
function createSeededRNG(str) {
  const seedGenerator = xmur3(str);
  return mulberry32(seedGenerator());
}



var random = createSeededRNG("my-unique-string-seed");

/**
 * Generates a seeded random integer.
 * @param {number} min - Inclusive lower bound
 * @param {number} max - Exclusive upper bound
 */
function getRandomInt(min, max) {
  // random() returns a float from 0 (inclusive) to 1 (exclusive)
  return Math.floor(random() * (max - min)) + min;
}
